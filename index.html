<body>
  <!-- Shown instantly before JS loads -->
  <div id="app-loading">
    <div style="font-size:52px">🎓</div>
    <div style="font-size:20px;font-weight:900;color:#F59E0B">OstazAI — أستاذ AI</div>
    <div class="spin"></div>
  </div>
  <div id="app" style="display:none"></div>

  <script src="app.js?v=148"></script>
  <script>
    // Hide loading screen — set up observer AND check immediately (app.js may have already rendered)
    (function() {
      function checkApp() {
        const app = document.getElementById('app');
        const loading = document.getElementById('app-loading');
        if (app && app.innerHTML.trim() && loading) {
          loading.style.display = 'none';
          app.style.display = '';
          return true;
        }
        return false;
      }
      if (!checkApp()) {
        const obs = new MutationObserver(() => { if (checkApp()) obs.disconnect(); });
        const app = document.getElementById('app');
        if (app) obs.observe(app, { childList: true, subtree: true });
      }
    })();
  </script>
  <script>
    // Register service worker (for push notifications + offline caching)

      navigator.serviceWorker.register('/sw.js').catch(() => {});

  </script>
