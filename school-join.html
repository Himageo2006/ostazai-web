<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Join Your School — OstazAI</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,sans-serif;background:#0F172A;color:#F1F5F9;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.card{background:#1E293B;border-radius:16px;padding:36px 32px;width:100%;max-width:440px;border:1px solid #334155}
.logo{text-align:center;font-size:22px;font-weight:900;color:#3B82F6;margin-bottom:24px}
.logo span{color:#F1F5F9}
h2{font-size:20px;font-weight:800;color:#F1F5F9;margin-bottom:6px;text-align:center}
.sub{font-size:13px;color:#94A3B8;text-align:center;margin-bottom:24px}
.tabs{display:flex;gap:8px;margin-bottom:24px;background:#0F172A;border-radius:10px;padding:4px}
.tab{flex:1;padding:10px;text-align:center;border-radius:8px;cursor:pointer;font-size:13px;font-weight:600;color:#64748B;transition:.2s}
.tab.active{background:#3B82F6;color:#fff}
.form-group{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
label{font-size:13px;font-weight:600;color:#CBD5E1}
input{background:#0F172A;border:1px solid #334155;border-radius:8px;padding:11px 14px;color:#F1F5F9;font-size:14px;outline:none;width:100%}
input:focus{border-color:#3B82F6}
input::placeholder{color:#475569}
.btn{width:100%;background:#3B82F6;color:#fff;border:none;border-radius:10px;padding:13px;font-size:15px;font-weight:700;cursor:pointer;margin-top:6px}
.btn:hover{background:#2563EB}
.btn:disabled{background:#334155;cursor:not-allowed}
.error{background:#1a0a0a;border:1px solid #EF4444;color:#EF4444;border-radius:8px;padding:12px;font-size:13px;margin-top:12px;text-align:center}
.success{background:#052e16;border:1px solid #10B981;color:#10B981;border-radius:8px;padding:16px;font-size:14px;margin-top:12px;text-align:center;font-weight:600}
.divider{text-align:center;color:#475569;font-size:12px;margin:16px 0}
.back{text-align:center;margin-top:20px;font-size:13px;color:#64748B}
.back a{color:#3B82F6;text-decoration:none}
</style>
</head>
<body>
<div class="card">
  <div class="logo">🎓 Ostazz<span>AI</span></div>

  <div id="inviteSection" style="display:none">
    <h2 id="inviteTitle">Accept Your Invitation</h2>
    <div class="sub" id="inviteSub">Set your password to activate your account</div>
    <div class="form-group">
      <label>New Password</label>
      <input type="password" id="invitePassword" placeholder="Choose a strong password" minlength="8"/>
    </div>
    <div class="form-group">
      <label>Confirm Password</label>
      <input type="password" id="inviteConfirm" placeholder="Repeat your password"/>
    </div>
    <button class="btn" onclick="acceptInvite()">Activate Account</button>
    <div id="inviteMsg"></div>
  </div>

  <div id="joinSection" style="display:none">
    <h2>Join Your Class</h2>
    <div class="sub">Enter your class code to create your student account</div>
    <div class="tabs">
      <div class="tab active" onclick="switchTab('code')">Join with Code</div>
      <div class="tab" onclick="switchTab('login')">Already have account</div>
    </div>

    <div id="codeTab">
      <div class="form-group">
        <label>Class Code</label>
        <input type="text" id="joinCode" placeholder="e.g. AB3C9D" maxlength="6" style="text-transform:uppercase;letter-spacing:4px;text-align:center;font-size:20px;font-weight:700"/>
      </div>
      <div class="form-group">
        <label>Your Name</label>
        <input type="text" id="joinName" placeholder="Full name"/>
      </div>
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="joinEmail" placeholder="your@email.com"/>
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="joinPassword" placeholder="Choose a password" minlength="6"/>
      </div>
      <button class="btn" onclick="joinClass()">Join Class</button>
      <div id="joinMsg"></div>
    </div>

    <div id="loginTab" style="display:none">
      <div class="form-group">
        <label>School Code</label>
        <input type="text" id="loginCode" placeholder="e.g. AB3C9D" maxlength="6" style="text-transform:uppercase;letter-spacing:4px;text-align:center;font-size:20px;font-weight:700"/>
      </div>
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="loginEmail" placeholder="your@email.com"/>
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="loginPassword" placeholder="Your password"/>
      </div>
      <button class="btn" onclick="schoolLogin()">Log In</button>
      <div id="loginMsg"></div>
      <div style="text-align:center;margin-top:14px">
        <button onclick="showForgotPassword()" style="background:none;border:none;color:#3B82F6;font-size:13px;cursor:pointer;text-decoration:underline">Forgot your password?</button>
      </div>
    </div>
  </div>

  <!-- Forgot Password Panel -->
  <div id="forgotPanel" style="display:none;margin-top:16px">
    <div style="background:#1a2540;border:1px solid #334155;border-radius:12px;padding:20px">
      <div style="font-size:15px;font-weight:700;color:#F1F5F9;margin-bottom:6px">🔒 Reset Password</div>
      <div style="font-size:13px;color:#64748B;margin-bottom:14px">Enter your school email — we'll send a reset link.</div>
      <div class="form-group">
        <input type="email" id="forgotEmail" placeholder="your@email.com"/>
      </div>
      <button class="btn" onclick="sendForgotPassword()">Send Reset Link</button>
      <div id="forgotMsg" style="margin-top:10px;font-size:13px;display:none"></div>
      <button onclick="hideForgotPassword()" style="background:none;border:none;color:#64748B;font-size:12px;cursor:pointer;margin-top:10px">← Back to login</button>
    </div>
  </div>

  <div class="back"><a href="/">← Back to OstazAI</a></div>
</div>

<script>
const API = 'https://ostazai-server-production.up.railway.app/api/school';
const params = new URLSearchParams(location.search);
const inviteToken = params.get('token');
const role = params.get('role') || 'student';

window.onload = () => {
  if (inviteToken) {
    document.getElementById('inviteSection').style.display = 'block';
    document.getElementById('inviteTitle').textContent =
      role === 'teacher' ? 'Accept Teacher Invitation' : 'Accept Invitation';
  } else {
    document.getElementById('joinSection').style.display = 'block';
    const code = params.get('code');
    if (code) document.getElementById('joinCode').value = code.toUpperCase();
  }
};

function switchTab(t) {
  document.querySelectorAll('.tab').forEach((el,i) => el.classList.toggle('active', (t==='code'&&i===0)||(t==='login'&&i===1)));
  document.getElementById('codeTab').style.display  = t === 'code'  ? 'block' : 'none';
  document.getElementById('loginTab').style.display = t === 'login' ? 'block' : 'none';
}

async function acceptInvite() {
  const pw = document.getElementById('invitePassword').value;
  const cf = document.getElementById('inviteConfirm').value;
  const msg = document.getElementById('inviteMsg');
  if (pw.length < 8) return showMsg(msg, 'Password must be at least 8 characters', 'error');
  if (pw !== cf)    return showMsg(msg, 'Passwords do not match', 'error');
  try {
    const r = await post('/auth/accept-invite', { token: inviteToken, password: pw });
    localStorage.setItem('school_token', r.token);
    localStorage.setItem('school_user',  JSON.stringify(r.user));
    localStorage.setItem('school_info',  JSON.stringify(r.school));
    showMsg(msg, '✅ Account activated! Redirecting...', 'success');
    setTimeout(() => location.href = '/school-portal.html', 1500);
  } catch(e) { showMsg(msg, e.message, 'error'); }
}

async function joinClass() {
  const code = document.getElementById('joinCode').value.toUpperCase().trim();
  const name = document.getElementById('joinName').value.trim();
  const email = document.getElementById('joinEmail').value.trim();
  const pw = document.getElementById('joinPassword').value;
  const msg = document.getElementById('joinMsg');
  if (!code||!name||!email||!pw) return showMsg(msg, 'All fields required', 'error');
  try {
    const r = await post('/auth/join-class', { joinCode: code, name, email, password: pw });
    localStorage.setItem('school_token', r.token);
    localStorage.setItem('school_user',  JSON.stringify(r.user));
    localStorage.setItem('school_info',  JSON.stringify(r.school));
    showMsg(msg, `✅ Joined ${r.class}! Redirecting...`, 'success');
    setTimeout(() => location.href = '/school-portal.html', 1500);
  } catch(e) { showMsg(msg, e.message, 'error'); }
}

async function schoolLogin() {
  const code  = document.getElementById('loginCode').value.toUpperCase().trim();
  const email = document.getElementById('loginEmail').value.trim();
  const pw    = document.getElementById('loginPassword').value;
  const msg   = document.getElementById('loginMsg');
  if (!email||!pw) return showMsg(msg, 'Email and password required', 'error');
  try {
    const r = await post('/auth/login', { email, password: pw, schoolCode: code });
    localStorage.setItem('school_token', r.token);
    localStorage.setItem('school_user',  JSON.stringify(r.user));
    localStorage.setItem('school_info',  JSON.stringify(r.school));
    showMsg(msg, '✅ Logged in! Redirecting...', 'success');
    setTimeout(() => location.href = '/school-portal.html', 1200);
  } catch(e) { showMsg(msg, e.message, 'error'); }
}

async function post(path, body) {
  const r = await fetch(API + path, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body) });
  const d = await r.json();
  if (!r.ok) throw new Error(d.error || 'Request failed');
  return d;
}

function showMsg(el, text, type) {
  el.className = type === 'error' ? 'error' : 'success';
  el.textContent = text;
  el.style.display = 'block';
}

function showForgotPassword() {
  document.getElementById('forgotPanel').style.display = 'block';
  document.getElementById('forgotEmail').value = document.getElementById('loginEmail')?.value || '';
  document.getElementById('forgotEmail').focus();
}

function hideForgotPassword() {
  document.getElementById('forgotPanel').style.display = 'none';
  document.getElementById('forgotMsg').style.display = 'none';
}

async function sendForgotPassword() {
  const email = document.getElementById('forgotEmail').value.trim();
  const msg   = document.getElementById('forgotMsg');
  msg.style.display = 'none';
  if (!email) { msg.style.color='#EF4444'; msg.textContent='Please enter your email.'; msg.style.display='block'; return; }
  try {
    await post('/forgot-password', { email });
    msg.style.color = '#10B981';
    msg.textContent = '✅ If your email is registered, a reset link has been sent. Check your inbox.';
    msg.style.display = 'block';
    document.getElementById('forgotEmail').value = '';
  } catch(e) {
    msg.style.color = '#EF4444';
    msg.textContent = e.message || 'Something went wrong. Please try again.';
    msg.style.display = 'block';
  }
}
</script>
</body>
</html>
