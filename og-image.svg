<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0F172A"/>
      <stop offset="100%" style="stop-color:#1E293B"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3B82F6"/>
      <stop offset="100%" style="stop-color:#8B5CF6"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)" rx="0"/>
  <!-- Glow circle -->
  <circle cx="200" cy="315" r="300" fill="#3B82F6" opacity="0.06"/>
  <circle cx="1000" cy="100" r="200" fill="#F59E0B" opacity="0.05"/>
  <!-- Brand bar -->
  <rect x="0" y="0" width="8" height="630" fill="url(#accent)"/>
  <!-- Logo emoji -->
  <text x="120" y="280" font-size="120" text-anchor="middle" font-family="Arial">🎓</text>
  <!-- Title -->
  <text x="120" y="360" font-size="52" font-weight="900" fill="#F59E0B" font-family="Cairo,Arial" text-anchor="middle" direction="rtl">أستاذ AI</text>
  <!-- Tagline -->
  <text x="650" y="260" font-size="48" font-weight="900" fill="#F1F5F9" font-family="Cairo,Arial" text-anchor="middle" direction="rtl">مساعدك الذكي للتعليم</text>
  <!-- Sub -->
  <text x="650" y="330" font-size="28" fill="#94A3B8" font-family="Cairo,Arial" text-anchor="middle" direction="rtl">اسأل في أي مادة واحصل على إجابة فورية</text>
  <!-- Features -->
  <text x="350" y="430" font-size="22" fill="#3B82F6" font-family="Cairo,Arial" text-anchor="middle" direction="rtl">📸 حل بالصورة</text>
  <text x="640" y="430" font-size="22" fill="#3B82F6" font-family="Cairo,Arial" text-anchor="middle" direction="rtl">🧠 خرائط ذهنية</text>
  <text x="930" y="430" font-size="22" fill="#3B82F6" font-family="Cairo,Arial" text-anchor="middle" direction="rtl">📝 اختبارات ذكية</text>
  <!-- Bottom bar -->
  <rect x="0" y="580" width="1200" height="50" fill="#0F172A" opacity="0.8"/>
  <text x="600" y="613" font-size="20" fill="#475569" font-family="Cairo,Arial" text-anchor="middle">ostazai.surge.sh</text>
</svg>
