<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Mr. Amin — 3D AI Tutor (Prototype)</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:Arial,sans-serif;background:linear-gradient(160deg,#0F172A,#1E293B);color:#F1F5F9;overflow:hidden}
  header{display:none}
  .badge{font-size:11px;background:#1c1a05;color:#F59E0B;border:1px solid #F59E0B;border-radius:20px;padding:2px 10px;font-weight:700}
  .urlbar{position:fixed;top:0;left:0;right:0;z-index:30;padding:10px 16px;border-bottom:1px solid #334155;background:rgba(15,23,42,.92);backdrop-filter:blur(6px)}
  .urlbar .ttl{font-weight:900;font-size:15px;margin-right:8px}
  .urlbar .ttl span{color:#3B82F6}
  #stage{position:fixed;inset:0;z-index:1}
  #avatar{width:100%;height:100%;display:block}
  #status{position:absolute;top:14px;left:50%;transform:translateX(-50%);font-size:13px;color:#94A3B8;background:rgba(15,23,42,.7);padding:6px 14px;border-radius:20px;backdrop-filter:blur(4px)}
  #loader{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px;color:#64748B;text-align:center;padding:20px}
  .spinner{width:44px;height:44px;border:4px solid #334155;border-top-color:#3B82F6;border-radius:50%;animation:spin 1s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .controls{position:fixed;bottom:0;left:0;right:0;z-index:40;padding:12px 16px;border-top:2px solid #3B82F6;background:#0F172A;box-shadow:0 -4px 20px rgba(0,0,0,.5)}
  .row{display:flex;gap:10px;max-width:860px;margin:0 auto;align-items:flex-end;flex-wrap:wrap}
  textarea{flex:1;min-width:200px;padding:12px 16px;background:#1E293B;border:1px solid #334155;border-radius:10px;color:#F1F5F9;font-size:14px;resize:none;font-family:inherit}
  input[type=text]{flex:1;min-width:200px;padding:10px 14px;background:#1E293B;border:1px solid #334155;border-radius:10px;color:#F1F5F9;font-size:13px}
  select{padding:12px;background:#1E293B;border:1px solid #334155;border-radius:10px;color:#F1F5F9;font-size:13px;max-width:200px}
  button{padding:12px 22px;border:none;border-radius:10px;font-weight:700;font-size:15px;cursor:pointer}
  .btn-speak{background:#3B82F6;color:#fff}
  .btn-speak:hover{background:#2563EB}
  .btn-speak:disabled{opacity:.5;cursor:not-allowed}
  .btn-stop{background:#1a0a0a;color:#EF4444;border:1px solid #EF4444}
  .hint{max-width:860px;margin:8px auto 0;font-size:11px;color:#475569;text-align:center}
  .err{color:#EF4444;font-size:13px}
</style>
</head>
<body>
<header>
  <h1>🎓 Mr. Amin <span>3D</span></h1>
  <span class="badge">PROTOTYPE · Milestone 1</span>
</header>

<div class="urlbar">
  <div class="row" style="align-items:center">
    <span class="ttl">🎓 Mr. Amin <span>3D</span></span>
    <select id="modelPick" onchange="pickModel()" style="max-width:260px">
      <option value="assets3d/teacher-human.glb">Teacher — Human (your model)</option>
      <option value="assets3d/teacher.glb">Teacher — Stylized (your model)</option>
      <option value="assets/facecap.glb">Demo Face (placeholder)</option>
      <option value="__custom">Custom URL…</option>
    </select>
    <input id="avatarUrl" type="text" placeholder="Paste a Ready Player Me .glb URL" style="display:none"/>
    <button class="btn-speak" onclick="loadAvatarFromInput()" id="loadBtn" style="display:none">Load</button>
    <label style="font-size:12px;color:#94A3B8;display:flex;align-items:center;gap:6px"><input type="checkbox" id="fullBody" onchange="reframe()"/> Full body</label>
    <button class="btn-stop" onclick="reframe()" style="padding:8px 14px;font-size:13px">⟳ Reset view</button>
  </div>
  <div class="row" style="align-items:center;margin-top:8px">
    <input id="text" type="text" value="Hello! I'm Mr. Amin, your AI tutor." style="flex:1;min-width:180px"/>
    <button class="btn-speak" id="speakBtn" onclick="speak()" style="padding:10px 18px;font-size:15px">🔊 Speak</button>
    <button onclick="testMouth()" style="background:#10B981;color:#fff;padding:10px 16px">👄 Test Mouth</button>
    <button class="btn-stop" id="stopBtn" onclick="stopSpeaking()" style="padding:10px 16px">⏹ Stop</button>
    <select id="voice" title="Voice" style="max-width:200px"></select>
  </div>
</div>

<div id="stage">
  <canvas id="avatar"></canvas>
  <div id="status" style="display:none"></div>
  <div id="loader">
    <div class="spinner"></div>
    <div id="loaderText">Loading Mr. Amin…</div>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { KTX2Loader } from 'three/addons/loaders/KTX2Loader.js';
import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';
import { MeshoptDecoder } from 'three/addons/libs/meshopt_decoder.module.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const MORPH_QS = '?morphTargets=ARKit,Oculus%20Visemes&textureSizeLimit=1024';

function buildAvatarUrl(raw) {
  raw = (raw || '').trim();
  if (!raw) return 'assets3d/teacher-human.glb';
  if (raw.startsWith('assets')) return raw;          // local model, as-is
  let u = raw.split('?')[0];
  if (!/\.glb$/i.test(u)) u += '.glb';
  return u + MORPH_QS;                                // remote RPM avatar
}

// Restore last choice
const savedModel = localStorage.getItem('mrAmin_model') || 'assets3d/teacher-human.glb';
const savedCustom = localStorage.getItem('mrAmin_customUrl') || '';
const AVATAR_URL = savedModel === '__custom' ? buildAvatarUrl(savedCustom) : savedModel;

// Sync UI
const pick = document.getElementById('modelPick');
if ([...pick.options].some(o=>o.value===savedModel)) pick.value = savedModel;
if (savedModel === '__custom') { document.getElementById('avatarUrl').style.display=''; document.getElementById('loadBtn').style.display=''; document.getElementById('avatarUrl').value = savedCustom; }
if (localStorage.getItem('mrAmin_fullBody')==='1') document.getElementById('fullBody').checked = true;

window.pickModel = function(){
  const v = document.getElementById('modelPick').value;
  if (v === '__custom') { document.getElementById('avatarUrl').style.display=''; document.getElementById('loadBtn').style.display=''; return; }
  localStorage.setItem('mrAmin_model', v); location.reload();
};
window.loadAvatarFromInput = function(){ localStorage.setItem('mrAmin_model','__custom'); localStorage.setItem('mrAmin_customUrl', document.getElementById('avatarUrl').value.trim()); location.reload(); };
window.reframe = function(){ localStorage.setItem('mrAmin_fullBody', document.getElementById('fullBody').checked?'1':'0'); if(head) frameModel(); };

const canvas = document.getElementById('avatar');
const loaderEl = document.getElementById('loader');
const loaderText = document.getElementById('loaderText');
const statusEl = document.getElementById('status');

let renderer, scene, camera, clock, head, morphMesh=null, morphDict={}, controls=null;
let mouthIdx=[], blinkIdx=[], _mouthTest=false;
let modelSize = 1, modelCenter = new THREE.Vector3();
let talking=false, blinkTimer=0, nextBlink=2, visemeTimer=0, curViseme=null;

function setStatus(t){ if(!t){statusEl.style.display='none';return;} statusEl.textContent=t; statusEl.style.display='block'; }

function init(){
  renderer = new THREE.WebGLRenderer({ canvas, antialias:true, alpha:true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  resize();

  scene = new THREE.Scene();
  camera = new THREE.PerspectiveCamera(30, aspect(), 0.01, 100);

  scene.add(new THREE.HemisphereLight(0xffffff, 0x334155, 2.0));
  const key = new THREE.DirectionalLight(0xffffff, 2.2); key.position.set(1,2,3); scene.add(key);
  const fill = new THREE.DirectionalLight(0x88aaff, 0.7); fill.position.set(-2,1,1); scene.add(fill);

  clock = new THREE.Clock();

  controls = new OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.enablePan = false;

  const ktx2 = new KTX2Loader()
    .setTranscoderPath('https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/libs/basis/')
    .detectSupport(renderer);
  const draco = new DRACOLoader().setDecoderPath('https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/libs/draco/');
  const loader = new GLTFLoader().setKTX2Loader(ktx2).setMeshoptDecoder(MeshoptDecoder).setDRACOLoader(draco);
  loader.load(AVATAR_URL, onLoaded, onProgress, onError);

  window.addEventListener('resize', resize);
  // Drive the render loop with both RAF (smooth when visible) and a timer (never fully pauses)
  function raf(){ animate(); requestAnimationFrame(raf); }
  requestAnimationFrame(raf);
  setInterval(()=>{ if(document.hidden || (window.__frames||0)===__lastFrames) animate(); __lastFrames=window.__frames; }, 40);
}
let __lastFrames=0;

function aspect(){ return (canvas.clientWidth||1)/(canvas.clientHeight||1); }
function resize(){
  const w = canvas.clientWidth || canvas.parentElement.clientWidth;
  const h = canvas.clientHeight || canvas.parentElement.clientHeight;
  renderer.setSize(w,h,false);
  if(camera){ camera.aspect=w/h; camera.updateProjectionMatrix(); }
}

function onProgress(e){ if(e.total) loaderText.textContent = `Loading Mr. Amin… ${Math.round(e.loaded/e.total*100)}%`; }
function onError(err){ console.error(err); loaderEl.innerHTML = '<div class="err">Could not load this avatar.<br>If you pasted a custom URL, your network may block it — click <b>Reset to default</b>.</div>'; }

function onLoaded(gltf){
  head = gltf.scene;
  let best=0;
  head.traverse(o=>{
    if(o.isMesh){
      o.frustumCulled=false;
      const n = o.morphTargetInfluences ? o.morphTargetInfluences.length : 0;
      // Prefer named face mesh; else fall back to the mesh with the most morphs
      if(o.morphTargetDictionary && (o.morphTargetDictionary['jawOpen']!==undefined || o.morphTargetDictionary['viseme_aa']!==undefined)){
        morphMesh=o; morphDict=o.morphTargetDictionary; best=999;
      } else if(n>best && best<999){ best=n; morphMesh=o; morphDict=o.morphTargetDictionary||{}; }
    }
  });
  scene.add(head);
  fixPose();
  detectMorphs();
  window.__mesh=morphMesh; window.__mi=mouthIdx; window.__bi=blinkIdx;
  window.__state=()=>({talking, _mouthTest, headSet:!!head, sameMesh: window.__mesh===morphMesh});
  frameModel();
  loaderEl.style.display='none';
  setStatus('Ready — type something and press Speak');
  setTimeout(()=>setStatus(''),2500);
  loadVoices();
}

// Lower arms from T-pose to a relaxed stance (rotate upper-arm bones; Mixamo: +localX lowers)
function fixPose(){
  const bones={};
  head.traverse(o=>{ if(o.isBone) bones[o.name]=o; });
  const names=Object.keys(bones);
  const find=re=>bones[names.find(n=>re.test(n))];
  const LA=find(/LeftArm$/), RA=find(/RightArm$/);
  const LF=find(/LeftForeArm$/), RF=find(/RightForeArm$/);
  if(LA) LA.rotation.x += 1.15;
  if(RA) RA.rotation.x += 1.15;
  if(LF) LF.rotation.x += 0.15;
  if(RF) RF.rotation.x += 0.15;
  head.updateMatrixWorld(true);
}

// Find mouth-open + blink morphs (named for RPM/facecap, auto-detected for VRoid numeric morphs)
function detectMorphs(){
  mouthIdx=[]; blinkIdx=[];
  if(!morphMesh) return;
  const named=Object.keys(morphDict);
  const vis=named.filter(n=>/viseme_|jawOpen|mouthOpen/i.test(n));
  if(vis.length){
    mouthIdx = vis.map(n=>morphDict[n]);
    blinkIdx = ['eyeBlinkLeft','eyeBlinkRight','eyesClosed'].filter(n=>morphDict[n]!=null).map(n=>morphDict[n]);
    return;
  }
  // Numeric: analyze geometry morph deltas
  const geo=morphMesh.geometry, pos=geo.attributes.position, morphs=geo.morphAttributes&&geo.morphAttributes.position;
  if(!morphs) return;
  const N=pos.count;
  let minY=1e9,maxY=-1e9; for(let i=0;i<N;i++){const y=pos.getY(i); if(y<minY)minY=y; if(y>maxY)maxY=y;}
  const low=minY+(maxY-minY)*0.35;
  const stats=morphs.map((mp,t)=>{ let moved=0,sumdy=0,lowMoved=0; for(let i=0;i<N;i++){const d=Math.abs(mp.getX(i))+Math.abs(mp.getY(i))+Math.abs(mp.getZ(i)); if(d>1e-5){moved++; sumdy+=mp.getY(i); if(pos.getY(i)<low)lowMoved++;}} return {t,moved,avgDy:moved?sumdy/moved:0,lowMoved}; });
  mouthIdx = stats.filter(s=>s.lowMoved>20 && s.avgDy<-0.002).sort((a,b)=>a.avgDy-b.avgDy).slice(0,4).map(s=>s.t);
  blinkIdx = stats.filter(s=>s.lowMoved===0 && s.moved>300 && s.avgDy<0).sort((a,b)=>b.moved-a.moved).slice(0,1).map(s=>s.t);
}

function setMorphIdx(i,v){ if(morphMesh&&i!=null&&morphMesh.morphTargetInfluences[i]!==undefined) morphMesh.morphTargetInfluences[i]=v; }

function frameModel(){
  // reset transform so bbox is clean
  head.position.set(0,0,0); head.rotation.set(0,0,0);
  const box = new THREE.Box3().setFromObject(head);
  box.getCenter(modelCenter);
  const size = box.getSize(new THREE.Vector3());
  const fov = camera.fov * Math.PI/180;
  const fullBody = document.getElementById('fullBody').checked;

  let target, dist;
  if (fullBody) {
    modelSize = Math.max(size.x, size.y) || 1;
    dist = (modelSize/2) / Math.tan(fov/2) * 1.25;
    target = modelCenter.clone();
  } else {
    const headY = box.max.y - size.y*0.11;            // eye line
    const portrait = size.y*0.34;                      // head + a little shoulders
    modelSize = portrait || 1;
    dist = (modelSize/2) / Math.tan(fov/2) * 1.45;
    target = new THREE.Vector3(modelCenter.x, headY, modelCenter.z);
  }
  camera.near = Math.max(dist/100,0.01); camera.far = dist*100; camera.updateProjectionMatrix();
  camera.position.set(target.x, target.y, box.max.z + dist);
  camera.lookAt(target);
  if (controls){
    controls.target.copy(target);
    controls.minDistance = dist*0.5;
    controls.maxDistance = dist*2.5;
    controls.update();
  }

  // Debug readout for diagnostics
  window.__dbg = {
    size:{x:+size.x.toFixed(3),y:+size.y.toFixed(3),z:+size.z.toFixed(3)},
    center:{x:+modelCenter.x.toFixed(3),y:+modelCenter.y.toFixed(3),z:+modelCenter.z.toFixed(3)},
    camPos:{x:+camera.position.x.toFixed(2),y:+camera.position.y.toFixed(2),z:+camera.position.z.toFixed(2)},
    dist:+dist.toFixed(2), fullBody
  };
}

function setMorph(name,v){ if(!morphMesh)return; const i=morphDict[name]; if(i===undefined)return; morphMesh.morphTargetInfluences[i]=v; }

const VISEMES=['viseme_aa','viseme_E','viseme_I','viseme_O','viseme_U','viseme_PP','viseme_FF','viseme_kk'];
const ARKIT_MOUTH=['mouthFunnel','mouthPucker','mouthLeft','mouthRight'];

function animate(){
  window.__frames=(window.__frames||0)+1;
  if(controls) controls.update();
  if(!head){ if(renderer&&scene&&camera) renderer.render(scene,camera); return; }
  const dt=clock.getDelta(), t=clock.elapsedTime;

  // Idle: breathe + sway (scaled to model size)
  head.position.y = Math.sin(t*1.2)*modelSize*0.004;
  head.rotation.y = Math.sin(t*0.5)*0.045;
  head.rotation.x = Math.sin(t*0.37)*0.02;

  // Blink
  blinkTimer+=dt; let blink=0;
  if(blinkTimer>nextBlink){
    const p=blinkTimer-nextBlink;
    blink = p<0.06 ? p/0.06 : p<0.12 ? 1-(p-0.06)/0.06 : 0;
    if(p>=0.12){ blinkTimer=0; nextBlink=2+Math.random()*3; }
  }
  blinkIdx.forEach(i=>setMorphIdx(i,blink));

  // Talk — drive the detected mouth morphs
  if(_mouthTest){ /* held open by testMouth() */ }
  else if(talking){
    // Drive the SAME morphs the Test button uses, oscillating for a talking motion
    const open = 0.15 + (0.5 + 0.5*Math.sin(t*13))*0.70;   // 0.15 .. 0.85
    mouthIdx.forEach(i=>setMorphIdx(i, open));
    setMorph('jawOpen', open);                               // named-model fallback
  } else {
    mouthIdx.forEach(i=>setMorphIdx(i,0));
    setMorph('jawOpen',0);
    setMorph('mouthSmileLeft',0.10); setMorph('mouthSmileRight',0.10);
  }
  renderer.render(scene,camera);
}
let curMouth=null;

// ── Voice: Microsoft Edge neural TTS (free, natural) + amplitude lip-sync ──────
let voices=[];
function loadVoices(){
  voices = speechSynthesis.getVoices();
  const sel=document.getElementById('voice'); if(!sel||!voices.length) return;
  sel.innerHTML = voices.map((v,i)=>`<option value="${i}">${v.name} (${v.lang})</option>`).join('');
  const pref = voices.findIndex(v=>/en(-|_)?(US|GB)/i.test(v.lang)); if(pref>=0) sel.value=pref;
}
speechSynthesis.onvoiceschanged = loadVoices;

// --- Edge neural TTS (returns an MP3 Blob); voices: ar-EG-ShakirNeural / en-US-GuyNeural ---
let _edgeBlocked=false;
async function _edgeSecMsGec(){
  const WIN_EPOCH=11644473600n;
  let ticks=(BigInt(Math.floor(Date.now()/1000))+WIN_EPOCH)*10000000n; ticks-=ticks%3000000000n;
  const bytes=new TextEncoder().encode(ticks.toString()+'6A5AA1D4EAFF4E9FB37E23D68491D6F4');
  const hash=await crypto.subtle.digest('SHA-256',bytes);
  return [...new Uint8Array(hash)].map(b=>b.toString(16).padStart(2,'0')).join('').toUpperCase();
}
function _edgeTTS(text, voice='en-US-GuyNeural', rate='-2%'){
  return new Promise((resolve,reject)=>{
    if(_edgeBlocked||!window.WebSocket||!(crypto&&crypto.subtle)) return reject(new Error('edge unavailable'));
    _edgeSecMsGec().then(gec=>{
      const url=`wss://speech.platform.bing.com/consumer/speech/synthesize/readaloud/edge/v1?TrustedClientToken=6A5AA1D4EAFF4E9FB37E23D68491D6F4&Sec-MS-GEC=${gec}&Sec-MS-GEC-Version=1-130.0.2849.68`;
      let ws; try{ ws=new WebSocket(url);}catch(e){return reject(e);} ws.binaryType='arraybuffer';
      const chunks=[]; let settled=false;
      const fail=e=>{ if(settled)return; settled=true; _edgeBlocked=true; try{ws.close();}catch(_){} reject(e); };
      const to=setTimeout(()=>fail(new Error('edge timeout')),11000);
      ws.onopen=()=>{
        const ts=new Date().toISOString();
        ws.send(`X-Timestamp:${ts}\r\nContent-Type:application/json; charset=utf-8\r\nPath:speech.config\r\n\r\n{"context":{"synthesis":{"audio":{"metadataoptions":{"sentenceBoundaryEnabled":"false","wordBoundaryEnabled":"false"},"outputFormat":"audio-24khz-48kbitrate-mono-mp3"}}}}`);
        const id=(crypto.randomUUID?crypto.randomUUID():'x'+Date.now()+Math.random()).replace(/-/g,'');
        const esc=String(text).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
        const xmlLang=voice.split('-').slice(0,2).join('-')||'en-US';
        const ssml=`<speak version='1.0' xmlns='http://www.w3.org/2001/10/synthesis' xml:lang='${xmlLang}'><voice name='${voice}'><prosody rate='${rate}'>${esc}</prosody></voice></speak>`;
        ws.send(`X-RequestId:${id}\r\nContent-Type:application/ssml+xml\r\nX-Timestamp:${ts}Z\r\nPath:ssml\r\n\r\n${ssml}`);
      };
      ws.onmessage=ev=>{
        if(typeof ev.data==='string'){ if(ev.data.includes('Path:turn.end')){ clearTimeout(to); settled=true; try{ws.close();}catch(_){}
          chunks.length?resolve(new Blob(chunks,{type:'audio/mpeg'})):reject(new Error('edge empty')); } }
        else{ const buf=new Uint8Array(ev.data); const h=(buf[0]<<8)|buf[1]; chunks.push(buf.slice(2+h)); }
      };
      ws.onerror=()=>fail(new Error('edge ws error'));
      ws.onclose=()=>{ if(!settled) fail(new Error('edge closed')); };
    }).catch(reject);
  });
}

let _audioEl=null, _actx=null, _analyser=null, _lipData=null;
function pickVoice(text){ return /[؀-ۿ]/.test(text) ? 'ar-EG-ShakirNeural' : 'en-US-GuyNeural'; }

function playWithLipsync(blob){
  return new Promise((resolve)=>{
    _audioEl=new Audio(URL.createObjectURL(blob)); _audioEl.crossOrigin='anonymous';
    try{
      _actx=_actx||new (window.AudioContext||window.webkitAudioContext)();
      const src=_actx.createMediaElementSource(_audioEl);
      _analyser=_actx.createAnalyser(); _analyser.fftSize=256;
      _lipData=new Uint8Array(_analyser.frequencyBinCount);
      src.connect(_analyser); _analyser.connect(_actx.destination);
      if(_actx.state==='suspended') _actx.resume();
    }catch(e){ _analyser=null; }
    _mouthTest=true; // own the mouth
    clearInterval(window._talkIv);
    window._talkIv=setInterval(()=>{
      let open;
      if(_analyser){ _analyser.getByteTimeDomainData(_lipData);
        let sum=0; for(let i=0;i<_lipData.length;i++){const d=(_lipData[i]-128)/128; sum+=d*d;}
        const rms=Math.sqrt(sum/_lipData.length);
        open=Math.min(1, rms*4.5);                 // amplitude → mouth open (real lip-sync)
      } else { open=0.12+(0.5+0.5*Math.sin(performance.now()/70))*0.7; }
      mouthIdx.forEach(i=>setMorphIdx(i,open)); setMorph('jawOpen',open);
    },40);
    _audioEl.onended=()=>{ window.stopSpeaking(); resolve(); };
    _audioEl.onerror=()=>{ window.stopSpeaking(); resolve(); };
    _audioEl.play().catch(()=>{ window.stopSpeaking(); resolve(); });
  });
}

window.speak = async function(text, lang){
  text = (text!=null?String(text):document.getElementById('text').value).trim(); if(!text) return;
  stopSpeaking();
  const b=document.getElementById('speakBtn'); if(b) b.disabled=true;
  setStatus('🗣️ Mr. Amin is speaking…');
  const voice = lang==='ar'?'ar-EG-ShakirNeural' : lang==='en'?'en-US-GuyNeural' : pickVoice(text);
  try{
    const blob = await _edgeTTS(text, voice);   // natural neural voice
    await playWithLipsync(blob);                 // amplitude-driven lip-sync
    return;
  }catch(e){ /* fall through to browser speech + oscillation */ }
  // Fallback: browser SpeechSynthesis + oscillating mouth
  _mouthTest=true; const start=performance.now(); const est=Math.max(1800,text.length*70);
  clearInterval(window._talkIv);
  window._talkIv=setInterval(()=>{ const el=performance.now()-start; if(el>=est){window.stopSpeaking();return;}
    const open=0.12+(0.5+0.5*Math.sin(el/70))*0.75; mouthIdx.forEach(i=>setMorphIdx(i,open)); setMorph('jawOpen',open); },45);
  try{ const u=new SpeechSynthesisUtterance(text); const vi=document.getElementById('voice')?.value; if(voices[vi]) u.voice=voices[vi]; speechSynthesis.speak(u);}catch(e){}
};

window.stopSpeaking=function(){
  clearInterval(window._talkIv);
  _mouthTest=false; talking=false;
  if(mouthIdx) mouthIdx.forEach(i=>setMorphIdx(i,0)); setMorph('jawOpen',0);
  try{ if(_audioEl){ _audioEl.pause(); _audioEl=null; } }catch(e){}
  try{ speechSynthesis.cancel(); }catch(e){}
  const b=document.getElementById('speakBtn'); if(b) b.disabled=false;
  setStatus('');
};

// ── Embed mode (for the AI Tutor): hide controls, accept speak via postMessage ──
const EMBED = new URLSearchParams(location.search).get('embed')==='1';
if(EMBED){ const u=document.querySelector('.urlbar'); if(u) u.style.display='none'; }
window.addEventListener('message', (e)=>{
  const d=e.data||{};
  if(d.type==='speak' && d.text) window.speak(d.text, d.lang);
  else if(d.type==='stop') window.stopSpeaking();
});

// Diagnostic: force the detected mouth morphs fully open for 2.5s
window.testMouth=function(){
  setStatus('👄 Mouth open test — '+(mouthIdx.length?('morphs '+mouthIdx.join(',')):'NO mouth morphs found!'));
  if(!mouthIdx.length){ return; }
  _mouthTest=true;
  mouthIdx.forEach(i=>setMorphIdx(i,1.0));
  setMorph('jawOpen',1.0);
  clearTimeout(window._mt);
  window._mt=setTimeout(()=>{ _mouthTest=false; mouthIdx.forEach(i=>setMorphIdx(i,0)); setMorph('jawOpen',0); setStatus(''); }, 2500);
};

init();
</script>
</body>
