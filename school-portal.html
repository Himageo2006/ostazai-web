<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>School Portal — OstazAI</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,sans-serif;background:#0F172A;color:#F1F5F9;min-height:100vh}

/* ── Layout ── */
.sidebar{position:fixed;top:0;left:0;width:220px;height:100vh;background:#1E293B;border-right:1px solid #334155;display:flex;flex-direction:column;z-index:100;transition:transform .25s}
.main{margin-left:220px;padding:28px;min-height:100vh}
.hamburger{display:none;position:fixed;top:12px;left:12px;z-index:300;background:#1E293B;border:1px solid #334155;border-radius:8px;padding:8px 10px;cursor:pointer;font-size:18px;color:#F1F5F9}
.sidebar-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:99}
@media(max-width:768px){
  .sidebar{transform:translateX(-100%);width:240px}
  .sidebar.open{transform:translateX(0)}
  .sidebar-overlay.open{display:block}
  .main{margin-left:0;padding:16px}
  .hamburger{display:flex;align-items:center;justify-content:center}
  .page-title{font-size:18px}
  .stat-grid{grid-template-columns:repeat(2,1fr)}
}

/* ── Sidebar ── */
.logo{padding:20px 16px 16px;font-size:18px;font-weight:900;color:#3B82F6;border-bottom:1px solid #334155}
.logo span{color:#F1F5F9}
.school-name{padding:12px 16px;font-size:12px;color:#64748B;font-weight:600;border-bottom:1px solid #334155;word-break:break-word}
.nav{flex:1;padding:12px 0}
.nav-item{display:flex;align-items:center;gap:10px;padding:11px 16px;cursor:pointer;font-size:14px;font-weight:600;color:#94A3B8;transition:.15s;border-radius:0}
.nav-item:hover{background:#334155;color:#F1F5F9}
.nav-item.active{background:#1e3a5f;color:#3B82F6;border-right:3px solid #3B82F6}
.nav-item .icon{font-size:16px;width:20px;text-align:center}
.sidebar-footer{padding:16px;border-top:1px solid #334155}
.user-chip{font-size:12px;color:#64748B;margin-bottom:10px;word-break:break-word}
.user-chip b{color:#94A3B8;display:block}
.btn-logout{width:100%;background:#1a0a0a;border:1px solid #EF4444;color:#EF4444;border-radius:8px;padding:8px;font-size:13px;font-weight:700;cursor:pointer}
.btn-logout:hover{background:#EF4444;color:#fff}

/* ── Cards & Grid ── */
.page{display:none}.page.active{display:block}
.page-title{font-size:22px;font-weight:900;color:#F1F5F9;margin-bottom:6px}
.page-sub{font-size:14px;color:#64748B;margin-bottom:24px}
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:16px;margin-bottom:28px}
.stat-card{background:#1E293B;border:1px solid #334155;border-radius:12px;padding:20px;text-align:center}
.stat-card .val{font-size:36px;font-weight:900;color:#3B82F6}
.stat-card .lbl{font-size:13px;color:#94A3B8;margin-top:4px}
.stat-card.green .val{color:#10B981}
.stat-card.amber .val{color:#F59E0B}

.card{background:#1E293B;border:1px solid #334155;border-radius:12px;padding:20px;margin-bottom:20px}
.card-title{font-size:15px;font-weight:800;color:#F1F5F9;margin-bottom:14px}

/* ── Table ── */
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;padding:10px 12px;color:#64748B;font-weight:700;border-bottom:2px solid #334155}
td{padding:10px 12px;border-bottom:1px solid #1a2540;color:#CBD5E1}
tr:last-child td{border:none}
tr:hover td{background:#1a2540}
.badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:700}
.badge.active{background:#052e16;color:#10B981}
.badge.pending{background:#1c1a05;color:#F59E0B}
.badge.student{background:#0f172a;color:#60A5FA}
.badge.teacher{background:#0f1e2a;color:#818CF8}
.badge.admin{background:#1a0a0a;color:#F87171}

/* ── Forms & Modals ── */
.modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:200;align-items:center;justify-content:center}
.modal-bg.open{display:flex}
.modal{background:#1E293B;border:1px solid #334155;border-radius:16px;padding:28px;width:100%;max-width:420px;position:relative}
.modal-title{font-size:17px;font-weight:800;color:#F1F5F9;margin-bottom:18px}
.modal-close{position:absolute;top:14px;right:16px;background:none;border:none;color:#64748B;font-size:20px;cursor:pointer}
.form-group{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}
.form-group label{font-size:12px;font-weight:700;color:#94A3B8;text-transform:uppercase;letter-spacing:.5px}
.form-group input,.form-group select{background:#0F172A;border:1px solid #334155;border-radius:8px;padding:10px 12px;color:#F1F5F9;font-size:14px;outline:none;width:100%}
.form-group input:focus,.form-group select:focus{border-color:#3B82F6}
.form-group select option{background:#1E293B}
.btn{display:inline-flex;align-items:center;gap:6px;padding:10px 18px;border-radius:8px;font-size:13px;font-weight:700;cursor:pointer;border:none;transition:.15s}
.btn-primary{background:#3B82F6;color:#fff}.btn-primary:hover{background:#2563EB}
.btn-success{background:#10B981;color:#fff}.btn-success:hover{background:#059669}
.btn-danger{background:transparent;border:1px solid #EF4444;color:#EF4444;font-size:12px;padding:5px 10px}.btn-danger:hover{background:#EF4444;color:#fff}
.btn-sm{padding:6px 12px;font-size:12px}
.btn-outline{background:transparent;border:1px solid #334155;color:#94A3B8}.btn-outline:hover{border-color:#3B82F6;color:#3B82F6}
.actions{display:flex;gap:8px;align-items:center}
.msg{padding:10px;border-radius:8px;font-size:13px;font-weight:600;margin-top:10px;text-align:center}
.msg.ok{background:#052e16;color:#10B981;border:1px solid #10B981}
.msg.err{background:#1a0a0a;color:#EF4444;border:1px solid #EF4444}

/* ── Progress bars ── */
.progress-wrap{margin-top:6px}
.progress-bar{height:6px;background:#334155;border-radius:3px;overflow:hidden}
.progress-bar .fill{height:100%;background:#3B82F6;border-radius:3px;transition:.3s}

/* ── Assigned topics ── */
.topic-card{background:#0F172A;border:1px solid #334155;border-radius:10px;padding:14px 16px;margin-bottom:10px;display:flex;align-items:center;justify-content:space-between}
.topic-card.done{border-color:#10B981;opacity:.7}
.topic-info .subject{font-size:11px;font-weight:700;color:#3B82F6;text-transform:uppercase;letter-spacing:.5px}
.topic-info .chapter{font-size:14px;font-weight:700;color:#F1F5F9;margin-top:2px}
.topic-info .date{font-size:11px;color:#64748B;margin-top:2px}
.btn-study{background:#3B82F6;color:#fff;border:none;border-radius:8px;padding:8px 16px;font-size:13px;font-weight:700;cursor:pointer;text-decoration:none}
.btn-study:hover{background:#2563EB}
.check-done{background:#052e16;color:#10B981;border:1px solid #10B981;border-radius:8px;padding:6px 12px;font-size:12px;font-weight:700}

/* ── Code chip ── */
.code-chip{background:#0F172A;border:2px dashed #334155;border-radius:10px;padding:14px 20px;text-align:center;cursor:pointer}
.code-chip .code{font-size:28px;font-weight:900;letter-spacing:6px;color:#3B82F6;font-family:monospace}
.code-chip .hint{font-size:11px;color:#64748B;margin-top:4px}

/* ── Timetable ── */
.tt-grid{display:grid;grid-template-columns:80px repeat(7,1fr);gap:2px;font-size:12px}
.tt-header{background:#334155;color:#94A3B8;padding:8px 4px;text-align:center;font-weight:700;border-radius:4px}
.tt-time{color:#64748B;padding:8px 4px;text-align:right;font-size:11px}
.tt-cell{min-height:44px;border-radius:6px;border:1px dashed #1E293B}
.tt-slot{border-radius:6px;padding:6px 8px;margin:1px;cursor:pointer;transition:.15s}
.tt-slot:hover{opacity:.85}
.tt-slot .s-subj{font-weight:800;font-size:11px;color:#fff}
.tt-slot .s-time{font-size:10px;color:rgba(255,255,255,.7);margin-top:2px}
@media(max-width:700px){.tt-grid{grid-template-columns:60px repeat(5,1fr)}}

/* ── Notifications ── */
.notif-bell{position:relative;cursor:pointer;padding:6px;margin-bottom:4px}
.notif-badge{position:absolute;top:0;right:0;background:#EF4444;color:#fff;border-radius:50%;width:16px;height:16px;font-size:10px;font-weight:800;display:flex;align-items:center;justify-content:center}
.notif-item{padding:12px 14px;border-bottom:1px solid #334155;cursor:pointer;transition:.15s}
.notif-item:hover{background:#1a2540}
.notif-item.unread{background:#1a2d4a;border-left:3px solid #3B82F6}
.notif-item .n-title{font-size:13px;font-weight:700;color:#F1F5F9}
.notif-item .n-msg{font-size:12px;color:#94A3B8;margin-top:2px}
.notif-item .n-time{font-size:11px;color:#475569;margin-top:4px}

/* ── Materials ── */
.material-card{background:#0F172A;border:1px solid #334155;border-radius:10px;padding:14px 16px;margin-bottom:10px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.material-card .m-icon{font-size:24px;flex-shrink:0}
.material-card .m-info .m-title{font-size:14px;font-weight:700;color:#F1F5F9}
.material-card .m-info .m-meta{font-size:12px;color:#64748B;margin-top:3px}
.material-card .m-actions{display:flex;gap:8px;flex-shrink:0}

/* ── Live session ── */
.live-container{display:grid;grid-template-columns:1fr 320px;gap:16px;height:calc(100vh - 140px)}
.jitsi-wrap{background:#000;border-radius:12px;overflow:hidden;position:relative}
.jitsi-wrap iframe{width:100%;height:100%;border:none}
.whiteboard-panel{background:#1E293B;border:1px solid #334155;border-radius:12px;display:flex;flex-direction:column;overflow:hidden}
.wb-toolbar{padding:8px 10px;background:#0F172A;display:flex;gap:8px;align-items:center;flex-wrap:wrap;border-bottom:1px solid #334155}
.wb-btn{background:#334155;border:none;color:#F1F5F9;border-radius:6px;padding:6px 10px;cursor:pointer;font-size:12px}
.wb-btn.active{background:#3B82F6}
.wb-canvas{flex:1;cursor:crosshair;display:block;background:#fff}
@media(max-width:900px){.live-container{grid-template-columns:1fr;height:auto}}

/* ── Submission ── */
.sub-card{background:#0F172A;border:1px solid #334155;border-radius:10px;padding:14px 16px;margin-bottom:10px}
.sub-card .sub-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px}
.sub-card .sub-title{font-size:14px;font-weight:700;color:#F1F5F9}
.sub-card .sub-meta{font-size:12px;color:#64748B;margin-top:2px}
.grade-badge{display:inline-block;background:#052e16;color:#10B981;border:1px solid #10B981;border-radius:20px;padding:3px 10px;font-size:12px;font-weight:700}
</style>
</head>
<body>

<!-- HAMBURGER (mobile) -->
<button class="hamburger" id="hamburgerBtn" onclick="toggleSidebar()">☰</button>
<div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>

<!-- SIDEBAR -->
<div class="sidebar" id="sidebar">
  <div class="logo">🎓 Ostazz<span>AI</span></div>
  <div class="school-name" id="sideSchoolName">Loading...</div>
  <nav class="nav" id="sideNav"></nav>
  <div class="sidebar-footer">
    <div class="user-chip"><b id="sideUserName">—</b><span id="sideUserEmail">—</span></div>
    <button class="btn-logout" onclick="logout()">Log Out</button>
  </div>
</div>

<!-- TRIAL BANNER -->
<div id="trialBanner" style="display:none;background:#1c1a05;border-bottom:2px solid #F59E0B;padding:10px 24px;margin-left:220px;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap">
  <div style="font-size:13px;color:#FCD34D"><span style="font-size:16px">⏳</span> <b>Free Trial</b> — <span id="trialDaysLeft"></span> days remaining. <button onclick="startCheckout()" style="background:#F59E0B;color:#000;border:none;border-radius:6px;padding:4px 14px;font-weight:700;cursor:pointer;font-size:13px" id="activateBtn">Activate now →</button></div>
  <div style="font-size:11px;color:#92400E">Your data is safe. Upgrade anytime before trial ends.</div>
</div>

<!-- MAIN CONTENT -->
<div class="main" id="mainContent">
  <div id="loadingState" style="display:flex;align-items:center;justify-content:center;height:60vh">
    <div style="text-align:center;color:#64748B"><div style="font-size:40px;margin-bottom:12px">🎓</div><div>Loading your portal...</div></div>
  </div>
  <div id="portalPages" style="display:none"></div>
</div>

<!-- MODALS -->
<div class="modal-bg" id="modalBg">
  <div class="modal" id="modalBox">
    <button class="modal-close" onclick="closeModal()">✕</button>
    <div id="modalContent"></div>
  </div>
</div>

<script>
const SERVER = 'https://ostazai-server-production.up.railway.app';
const API    = SERVER + '/api/school'; // kept for legacy fetch calls below
let TOKEN, USER, SCHOOL;

// Inside the iOS/Android app: hide all payment/subscription UI (Apple 3.1.1 / Play Billing).
// Schools manage billing on the website; the app shows no purchase path.
const IS_APP = (() => {
  try {
    return window.__OSTAZAI_APP === true
      || typeof window.ReactNativeWebView !== 'undefined'
      || new URLSearchParams(location.search).get('app') === '1'
      || localStorage.getItem('_isapp') === '1';
  } catch(_) { return false; }
})();
if (IS_APP) {
  try {
    const st = document.createElement('style');
    st.textContent = '#activateBtn,#activateBtn2,.pkg-upgrade{display:none!important}';
    (document.head || document.documentElement).appendChild(st);
  } catch(_) {}
}

// ── Bootstrap ─────────────────────────────────────────────────────────────────
window.onload = async () => {
  const params = new URLSearchParams(location.search);

  // Handle password reset link (no login needed)
  const resetToken = params.get('resetToken');
  if (resetToken) { showResetPasswordScreen(resetToken); return; }

  TOKEN = localStorage.getItem('school_token');
  USER  = JSON.parse(localStorage.getItem('school_user') || 'null');
  SCHOOL= JSON.parse(localStorage.getItem('school_info') || 'null');
  if (!TOKEN || !USER) return location.href = '/school-join.html';

  // Handle payment return
  if (params.get('activated') === '1') {
    history.replaceState({}, '', location.pathname);
    setTimeout(() => alert('🎉 Payment successful! Your school account is now active.'), 800);
  } else if (params.get('activated') === '0') {
    history.replaceState({}, '', location.pathname);
  }

  // Refresh from server
  try {
    const d = await api('GET', '/me');
    USER   = d.user;
    SCHOOL = d.school;
    localStorage.setItem('school_user', JSON.stringify(USER));
    localStorage.setItem('school_info', JSON.stringify(SCHOOL));
  } catch(e) {
    if (e.message === 'No token' || e.message === 'Invalid token') {
      logout(); return;
    }
  }

  renderSidebar();
  renderPages();
  navigate('dashboard');
  document.getElementById('loadingState').style.display = 'none';
  document.getElementById('portalPages').style.display  = 'block';
  showTrialBanner();
  startNotifPolling();
};

function showTrialBanner() {
  if (!SCHOOL || SCHOOL.status !== 'trial' || !SCHOOL.expiresAt) return;
  const msLeft  = new Date(SCHOOL.expiresAt) - new Date();
  const daysLeft = Math.ceil(msLeft / 86400000);
  if (daysLeft <= 0) return; // server will block on next request
  const banner = document.getElementById('trialBanner');
  document.getElementById('trialDaysLeft').textContent = daysLeft;
  banner.style.display = 'flex';
  // Push main content down on desktop
  const marginTop = banner.offsetHeight;
  document.getElementById('mainContent').style.marginTop = marginTop + 'px';
}

function logout() {
  localStorage.removeItem('school_token');
  localStorage.removeItem('school_user');
  localStorage.removeItem('school_info');
  location.href = '/school-join.html';
}

// ── Sidebar ───────────────────────────────────────────────────────────────────
const NAV_ADMIN   = [
  { id:'dashboard',     icon:'📊', label:'Dashboard' },
  { id:'teachers',      icon:'👨‍🏫', label:'Teachers' },
  { id:'students',      icon:'🎓', label:'Students' },
  { id:'classes',       icon:'🏫', label:'Classes' },
  { id:'attendance',    icon:'✅', label:'Attendance' },
  { id:'assessments',   icon:'🧪', label:'Assessments' },
  { id:'requests',      icon:'📨', label:'Requests' },
  { id:'reports',       icon:'📑', label:'Reports' },
  { id:'meetings',      icon:'🎥', label:'Online Classes' },
  { id:'timetable',     icon:'🗓️', label:'Timetable' },
  { id:'materials',     icon:'📚', label:'Materials' },
  { id:'notifications', icon:'🔔', label:'Notifications' },
  { id:'settings',      icon:'⚙️',  label:'Settings' },
];
const NAV_TEACHER = [
  { id:'dashboard',     icon:'📊', label:'Dashboard' },
  { id:'classes',       icon:'🏫', label:'My Classes' },
  { id:'students',      icon:'🎓', label:'My Students' },
  { id:'gradebook',     icon:'📒', label:'Grade Book' },
  { id:'attendance',    icon:'✅', label:'Attendance' },
  { id:'assessments',   icon:'🧪', label:'Assessments' },
  { id:'requests',      icon:'📨', label:'Requests' },
  { id:'reports',       icon:'📑', label:'Reports' },
  { id:'meetings',      icon:'🎥', label:'Online Classes' },
  { id:'timetable',     icon:'🗓️', label:'Timetable' },
  { id:'live',          icon:'🔴', label:'Live Class' },
  { id:'materials',     icon:'📚', label:'Materials' },
  { id:'submissions',   icon:'📥', label:'Submissions' },
  { id:'assign',        icon:'📋', label:'Assign Lessons' },
  { id:'notes',         icon:'📝', label:'Lesson Notes' },
  { id:'ai-tutor',      icon:'🤖', label:'AI Tutor' },
  { id:'notifications', icon:'🔔', label:'Notifications' },
  { id:'settings',      icon:'⚙️',  label:'Settings' },
];
const NAV_STUDENT = [
  { id:'dashboard',     icon:'📚', label:'My Lessons' },
  { id:'ai-tutor',      icon:'🤖', label:'AI Tutor' },
  { id:'timetable',     icon:'🗓️', label:'Timetable' },
  { id:'live',          icon:'🔴', label:'Live Class' },
  { id:'meetings',      icon:'🎥', label:'Online Classes' },
  { id:'materials',     icon:'📂', label:'Materials' },
  { id:'submit',        icon:'📤', label:'Submit Work' },
  { id:'progress',      icon:'📈', label:'My Progress' },
  { id:'my-attendance', icon:'✅', label:'My Attendance' },
  { id:'my-grades',     icon:'🧪', label:'My Grades' },
  { id:'my-requests',   icon:'📨', label:'Requests' },
  { id:'notifications', icon:'🔔', label:'Notifications' },
  { id:'settings',      icon:'⚙️',  label:'Settings' },
];
const NAV_PARENT = [
  { id:'children',      icon:'👨‍👩‍👧', label:'My Children' },
  { id:'meetings',      icon:'🎥', label:'Online Classes' },
  { id:'p-requests',    icon:'📨', label:'Requests' },
  { id:'settings',      icon:'⚙️',  label:'Settings' },
];

function renderSidebar() {
  document.getElementById('sideSchoolName').textContent = SCHOOL?.name || '—';
  document.getElementById('sideUserName').textContent   = USER.name;
  document.getElementById('sideUserEmail').textContent  = USER.email;
  const nav   = USER.role === 'admin' ? NAV_ADMIN : USER.role === 'teacher' ? NAV_TEACHER : USER.role === 'parent' ? NAV_PARENT : NAV_STUDENT;
  const sideNav = document.getElementById('sideNav');
  sideNav.innerHTML = nav.map(n =>
    `<div class="nav-item" id="nav-${n.id}" onclick="navigate('${n.id}')"><span class="icon">${n.icon}</span>${n.label}${n.id==='notifications'?'<span id="notifBadge" class="notif-badge" style="display:none;margin-left:auto">0</span>':''}</div>`
  ).join('');
}

function navigate(pageId) {
  if (typeof aitStopSpeak === 'function') aitStopSpeak();   // stop Mr. Amin if leaving mid-speech
  document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
  document.querySelectorAll('.page').forEach(el => el.classList.remove('active'));
  const navEl  = document.getElementById('nav-' + pageId);
  const pageEl = document.getElementById('page-' + pageId);
  if (navEl)  navEl.classList.add('active');
  if (pageEl) { pageEl.classList.add('active'); loadPage(pageId); }
  // Close sidebar on mobile after navigating
  if (window.innerWidth <= 768) closeSidebar();
}

function toggleSidebar() {
  const s = document.getElementById('sidebar');
  const o = document.getElementById('sidebarOverlay');
  s.classList.toggle('open');
  o.classList.toggle('open');
}
function closeSidebar() {
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('sidebarOverlay').classList.remove('open');
}

async function changePassword() {
  const oldP = document.getElementById('cp_old').value;
  const newP = document.getElementById('cp_new').value;
  const conf = document.getElementById('cp_confirm').value;
  const msg  = document.getElementById('cpMsg');
  msg.style.display = 'none';
  if (!oldP || !newP) { msg.style.color='#EF4444'; msg.textContent='Please fill all fields.'; msg.style.display='block'; return; }
  if (newP !== conf)  { msg.style.color='#EF4444'; msg.textContent='New passwords do not match.'; msg.style.display='block'; return; }
  if (newP.length < 6){ msg.style.color='#EF4444'; msg.textContent='Password must be at least 6 characters.'; msg.style.display='block'; return; }
  try {
    await api('POST', '/change-password', { currentPassword: oldP, newPassword: newP });
    msg.style.color = '#10B981';
    msg.textContent = '✅ Password updated successfully!';
    msg.style.display = 'block';
    document.getElementById('cp_old').value = '';
    document.getElementById('cp_new').value = '';
    document.getElementById('cp_confirm').value = '';
  } catch(e) {
    msg.style.color = '#EF4444';
    msg.textContent = e.message || 'Failed to update password.';
    msg.style.display = 'block';
  }
}

async function saveSchoolSettings() {
  const name       = document.getElementById('set_name')?.value?.trim();
  const country    = document.getElementById('set_country')?.value?.trim();
  const curriculum = document.getElementById('set_curriculum')?.value;
  const msgEl      = document.getElementById('settingsSaveMsg');
  try {
    const d = await api('PATCH', '/update-settings', { name, country, curriculum });
    SCHOOL = d.school;
    if (msgEl) { msgEl.style.display = 'block'; setTimeout(() => msgEl.style.display = 'none', 3000); }

async function saveStudentProfile() {
  const name  = document.getElementById('sp_name')?.value?.trim();
  const grade = document.getElementById('sp_grade')?.value?.trim();
  const msg   = document.getElementById('spMsg');
  msg.style.display = 'none';
  if (!name) { msg.style.color='#EF4444'; msg.textContent='Name cannot be empty.'; msg.style.display='block'; return; }
  try {
    const d = await api('PATCH', '/student/update-profile', { name, grade });
    USER = d.user;
    localStorage.setItem('school_user', JSON.stringify(USER));
    document.getElementById('sideUserName').textContent = USER.name;
    msg.style.color = '#10B981';
    msg.textContent = '✅ Profile updated!';
    msg.style.display = 'block';
  } catch(e) {
    msg.style.color = '#EF4444';
    msg.textContent = e.message || 'Failed to update profile.';
    msg.style.display = 'block';
  }
}

    const stu=(r.studentId&&r.studentId.name)?r.studentId.name:'—';
    const det=[r.title, r.item?('📚 '+r.item):'', r.startDate?(r.startDate+(r.endDate?(' → '+r.endDate):'')):'', r.dueDate?('return by '+r.dueDate):''].filter(Boolean).join('<br>');
    const act=r.status==='pending'?`<button class="btn btn-outline" style="color:#10B981" onclick="reqReview('${r._id}','approved')">Approve</button> <button class="btn btn-outline" style="color:#EF4444" onclick="reqReview('${r._id}','rejected')">Reject</button>`:(r.decision||'');
    return `<tr><td>${stu}</td><td>${reqTypeLabel(r.type)}</td><td style="font-size:13px">${det}${r.details?('<br><span style="color:#64748B">'+r.details+'</span>'):''}</td><td>${statusPill(r.status)}</td><td>${act}</td></tr>`;

}

async function submitMyRequest(){
  const body={ type:document.getElementById('myReq_type').value, title:document.getElementById('myReq_title').value.trim(), details:document.getElementById('myReq_details').value.trim(), startDate:document.getElementById('myReq_start').value, endDate:document.getElementById('myReq_end').value, item:document.getElementById('myReq_item').value.trim(), dueDate:document.getElementById('myReq_due').value };
  const msg=document.getElementById('myReqMsg');
  if(USER.role==='parent'){ const cs=document.getElementById('myReq_child'); if(!cs||!cs.value){ msg.style.color='#EF4444'; msg.textContent='Select a child.'; msg.style.display='block'; return; } body.studentId=cs.value; }
  if(!body.title){ msg.style.color='#EF4444'; msg.textContent='Please enter a title.'; msg.style.display='block'; return; }
  await api('POST','/requests',body);
  msg.style.color='#10B981'; msg.textContent='✅ Request submitted'; msg.style.display='block';
  document.getElementById('myReq_title').value=''; document.getElementById('myReq_details').value='';

}

// ── Link a parent to a student (teacher/admin) ──
async function linkParent(studentId, name){
  const pName=prompt('Parent full name for '+name+':'); if(!pName) return;
  const pEmail=prompt('Parent email:'); if(!pEmail) return;
  try{
    const d=await api('POST','/admin/add-parent',{studentId,parentName:pName,parentEmail:pEmail});
    if(d.tempPassword) alert('✅ Parent account created:\n\nEmail: '+d.email+'\nTemp password: '+d.tempPassword+'\nSchool code: '+d.schoolCode+'\n\nThey can log in at the school portal (credentials also emailed).');
    else alert('✅ Linked '+name+' to existing parent account ('+d.email+').');
  }catch(e){ alert('Error: '+e.message); }
}

// ── Page loaders ──────────────────────────────────────────────────────────────
async function loadPage(id) {
  try {
    if (USER.role === 'admin') {
      if (id === 'dashboard')     await loadAdminDashboard();
      if (id === 'teachers')      await loadTeachers();
      if (id === 'students')      await loadAdminStudents();
      if (id === 'classes')       await loadAdminClasses();
      if (id === 'timetable')     await loadTimetable('adminTimetableWrap');
      if (id === 'materials')     await loadMaterials('adminMaterialsList', false);
      if (id === 'notifications') await loadNotifications();
      if (id === 'requests')      await loadRequestsInbox();
      if (id === 'reports')       await loadReportsPicker();
      if (id === 'attendance')    await loadAttendancePage();
      if (id === 'assessments')   await loadAssessmentsPage();
      if (id === 'meetings')      await loadMeetingsManage();
    }
    if (USER.role === 'teacher') {
      if (id === 'dashboard')     await loadTeacherDashboard();
      if (id === 'classes')       await loadTeacherClasses();
      if (id === 'students')      await loadTeacherStudents();
      if (id === 'timetable')     { await loadTimetable('teacherTimetableWrap'); await populateLiveClassSelect(); }
      if (id === 'live')          await initTeacherLive();
      if (id === 'materials')     await loadMaterials('teacherMaterialsList', true);
      if (id === 'submissions')   await loadTeacherSubmissions();
      if (id === 'assign')        await loadAssignPage();
      if (id === 'gradebook')     await loadGradebookClasses();
      if (id === 'notes')         initNotesGenerator();
      if (id === 'notifications') { await loadNotifications(); await loadAnnounceClassOptions(); }
      if (id === 'ai-tutor')      initAITutor();
      if (id === 'attendance')    await loadAttendancePage();
      if (id === 'assessments')   await loadAssessmentsPage();
      if (id === 'requests')      await loadRequestsInbox();
      if (id === 'reports')       await loadReportsPicker();
      if (id === 'meetings')      await loadMeetingsManage();
    }
    if (USER.role === 'student') {
      if (id === 'dashboard')     await loadStudentAssigned();
      if (id === 'timetable')     await loadTimetable('studentTimetableWrap');
      if (id === 'live')          await checkLiveSession();
      if (id === 'materials')     await loadMaterials('studentMaterialsList', false);
      if (id === 'submit')        await loadMySubmissions();
      if (id === 'progress')      await loadStudentProgress();
      if (id === 'notifications') await loadNotifications();
      if (id === 'ai-tutor')      initAITutor();
      if (id === 'my-attendance') await loadMyAttendance();
      if (id === 'my-grades')     await loadMyGrades();
      if (id === 'my-requests')   await loadMyRequests();
      if (id === 'meetings')      await loadMeetingsUpcoming();
    }
    if (USER.role === 'parent') {
      if (id === 'children')      await loadParentChildren();
      if (id === 'p-requests')    await loadMyRequests();
      if (id === 'meetings')      await loadMeetingsUpcoming();
    }
  } catch(e) { console.error(e); }
}

async function loadAdminDashboard() {
  const d = await api('GET', '/admin/dashboard');
  const statsEl = document.getElementById('adminStats');
  statsEl.innerHTML = `
    <div class="stat-card"><div class="val">${d.teachers}</div><div class="lbl">Teachers (max ${SCHOOL.maxTeachers})</div></div>
    <div class="stat-card green"><div class="val">${d.students}</div><div class="lbl">Students (max ${SCHOOL.maxStudents})</div></div>
    <div class="stat-card amber"><div class="val">${d.classes}</div><div class="lbl">Classes</div></div>
    <div class="stat-card"><div class="val">${d.seatsLeft.students}</div><div class="lbl">Student Seats Left</div></div>`;
  const recEl = document.getElementById('recentStudents');
  if (!d.recentStudents?.length) { recEl.innerHTML = '<div style="color:#64748B;font-size:13px">No students yet.</div>'; return; }
  recEl.innerHTML = `<table><thead><tr><th>Name</th><th>Email</th><th>Last Active</th></tr></thead><tbody>` +
    d.recentStudents.map(s => `<tr><td>${s.name}</td><td style="color:#64748B">${s.email}</td><td style="color:#64748B">${s.lastSeen?new Date(s.lastSeen).toLocaleDateString():'Never'}</td></tr>`).join('') +
    `</tbody></table>`;
}

let _adminTeachers = [], _adminStudents = [];
async function loadTeachers() {
  const teachers = await api('GET', '/admin/teachers');
  _adminTeachers = teachers;
  const tbody = document.getElementById('teacherTableBody');
  if (!teachers.length) { tbody.innerHTML = '<tr><td colspan="5" style="color:#64748B">No teachers yet. Invite one above.</td></tr>'; return; }
  tbody.innerHTML = teachers.map(t => `<tr>
    <td>${t.name}</td>
    <td style="color:#64748B">${t.email}</td>
    <td><span class="badge ${t.status}">${t.status}</span></td>
    <td style="color:#64748B">${new Date(t.createdAt).toLocaleDateString()}</td>
    <td><button class="btn btn-danger btn-sm" onclick="removeTeacher('${t.id}','${t.name}')">Remove</button></td>
  </tr>`).join('');
}

async function loadAdminStudents() {
  const students = await api('GET', '/admin/students');
  _adminStudents = students;
  const tbody = document.getElementById('adminStudentBody');
  if (!students.length) { tbody.innerHTML = '<tr><td colspan="6" style="color:#64748B">No students yet.</td></tr>'; return; }
  tbody.innerHTML = students.map(s => `<tr>
    <td>${s.name}</td>
    <td style="color:#64748B">${s.email}</td>
    <td style="color:#64748B">${s.grade||'—'}</td>

}

async function loadTeacherDashboard() {
  const [classes, students] = await Promise.all([
    api('GET', '/teacher/classes'),
    api('GET', '/teacher/students'),
  ]);
  document.getElementById('tStatClasses').textContent  = classes.length;
  document.getElementById('tStatStudents').textContent = students.length;
  const act = document.getElementById('teacherRecentActivity');
  if (!students.length) { act.innerHTML = '<div style="color:#64748B;font-size:13px">No students yet. Create a class and add students.</div>'; return; }
  const recent = students.sort((a,b) => (b.lastSeen||0) > (a.lastSeen||0) ? 1:-1).slice(0,5);
  act.innerHTML = `<table><thead><tr><th>Student</th><th>Questions</th><th>Last Active</th></tr></thead><tbody>` +
    recent.map(s => `<tr><td>${s.name}</td><td>${s.totalQuestions||0}</td><td style="color:#64748B">${s.lastSeen?new Date(s.lastSeen).toLocaleDateString():'Never'}</td></tr>`).join('') +
    `</tbody></table>`;
}

// ── CSV export ──────────────────────────────────────────────────────────────────
function downloadCSV(filename, headers, rows) {
  const esc = v => {
    const s = (v ?? '').toString();
    return /[",\n]/.test(s) ? `"${s.replace(/"/g,'""')}"` : s;
  };
  const csv = [headers.join(','), ...rows.map(r => r.map(esc).join(','))].join('\r\n');
  const blob = new Blob(['﻿' + csv], { type: 'text/csv;charset=utf-8;' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 60000);
}

  }
  // Sort: overdue/pending first, completed last
  const topics = d.assignedTopics.slice().sort((a,b) => (a.completed?1:0) - (b.completed?1:0));
  el.innerHTML = topics.map(t => `

        ${dueDateBadge(t)}

function dueDateBadge(t) {
  if (!t.dueDate) return '';
  const due = new Date(t.dueDate);
  const dueStr = due.toLocaleDateString();
  if (t.completed) return `<div style="font-size:12px;color:#64748B;margin-top:4px">📅 Due ${dueStr}</div>`;
  const daysLeft = Math.ceil((due - Date.now()) / 86400000);
  if (daysLeft < 0)  return `<div style="font-size:12px;color:#EF4444;font-weight:700;margin-top:4px">⚠️ Overdue — was due ${dueStr}</div>`;
  if (daysLeft === 0) return `<div style="font-size:12px;color:#F59E0B;font-weight:700;margin-top:4px">⏰ Due today!</div>`;
  if (daysLeft <= 2)  return `<div style="font-size:12px;color:#F59E0B;font-weight:700;margin-top:4px">⏰ Due in ${daysLeft} day${daysLeft>1?'s':''} (${dueStr})</div>`;
  return `<div style="font-size:12px;color:#94A3B8;margin-top:4px">📅 Due ${dueStr}</div>`;
}

function readImportFile(input) {
  const file = input.files?.[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => { document.getElementById('impText').value = e.target.result; };
  reader.readAsText(file);
}

function parseStudentCSV(text) {
  const rows = [];
  text.split(/\r?\n/).forEach(line => {
    const t = line.trim();
    if (!t) return;
    // Skip a header row if present
    if (/^name\s*,\s*email/i.test(t)) return;
    const parts = t.split(',').map(p => p.trim());
    const [name, email, grade] = parts;
    if (name && email) rows.push({ name, email, grade: grade || '' });
  });
  return rows;
}

async function doImportStudents() {
  const classId = document.getElementById('impClass').value;
  const text    = document.getElementById('impText').value;
  const msg     = document.getElementById('impMsg');
  const resEl   = document.getElementById('impResults');
  msg.style.display='block';
  if (!classId) { msg.style.color='#EF4444'; msg.textContent='Please select a class.'; return; }
  const students = parseStudentCSV(text);
  if (!students.length) { msg.style.color='#EF4444'; msg.textContent='No valid rows found. Use: name,email,grade'; return; }
  msg.style.color='#94A3B8'; msg.textContent=`Importing ${students.length} student(s)...`;
  try {
    const d = await api('POST','/teacher/import-students',{ classId, students });
    msg.style.color='#10B981';
    msg.textContent = `✅ Created ${d.created}, skipped ${d.skipped} (already existed).`;

async function doResetPassword(token) {
  const newP = document.getElementById('rp_new').value;
  const conf = document.getElementById('rp_confirm').value;
  const msg  = document.getElementById('rp_msg');
  msg.style.display = 'none';
  if (!newP || newP.length < 6) { msg.style.color='#EF4444'; msg.textContent='Password must be at least 6 characters.'; msg.style.display='block'; return; }
  if (newP !== conf) { msg.style.color='#EF4444'; msg.textContent='Passwords do not match.'; msg.style.display='block'; return; }
  try {
    const SERVER = 'https://ostazai-server-production.up.railway.app';
    const r = await fetch(SERVER + '/api/school/reset-password', {
      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ token, newPassword: newP }),
    });
    const d = await r.json();
    if (!r.ok) { msg.style.color='#EF4444'; msg.textContent=d.error||'Failed.'; msg.style.display='block'; return; }
    // Log the user in automatically
    localStorage.setItem('school_token', d.token);
    localStorage.setItem('school_user',  JSON.stringify(d.user));
    localStorage.setItem('school_info',  JSON.stringify(d.school));
    history.replaceState({}, '', '/school-portal.html');
    location.reload();
  } catch(e) { msg.style.color='#EF4444'; msg.textContent=e.message; msg.style.display='block'; }
}

// Accepts both short paths (/admin/...) and full paths (/api/school-timetable/...)
async function api(method, path, body) {
  const url = path.startsWith('/api/') ? SERVER + path : API + path;
  const r = await fetch(url, {
    method, headers:{'Content-Type':'application/json','Authorization':'Bearer '+TOKEN},
    body: body ? JSON.stringify(body) : undefined,
  });
  const d = await r.json();
  if (!r.ok) {
    if (d.error === 'trial_expired') { showTrialExpired(); return; }
    throw new Error(d.error || 'Request failed');
  }
  return d;
}

  TIMES.forEach(t => {
    html += `<div class="tt-time">${t}</div>`;
    DAYS.forEach(d => {
      const slots = grouped[d].filter(e => e.startTime === t);
      html += `<div class="tt-cell">${slots.map(s=>`
        <div class="tt-slot" style="background:${s.color||'#3B82F6'}" title="${s.subject} ${s.startTime}–${s.endTime}">

function initWhiteboard(canvasId, isStudent) {
  const canvas = document.getElementById(canvasId);
  if (!canvas) return;
  canvas.width  = canvas.offsetWidth  || 300;
  canvas.height = canvas.offsetHeight || 400;
  const ctx = canvas.getContext('2d');
  if (isStudent) _swbCtx = ctx; else _wbCtx = ctx;
  ctx.strokeStyle = isStudent ? '#EF4444' : '#3B82F6';
  ctx.lineWidth = 4; ctx.lineCap = 'round'; ctx.lineJoin = 'round';

  let drawing = false, lastX = 0, lastY = 0;
  const getPos = e => {
    const r = canvas.getBoundingClientRect();
    const src = e.touches ? e.touches[0] : e;
    return [src.clientX - r.left, src.clientY - r.top];
  };
  const start = e => { e.preventDefault(); drawing = true; [lastX,lastY] = getPos(e); };
  const draw  = e => {
    e.preventDefault();
    if (!drawing) return;
    const [x,y] = getPos(e);
    const tool = isStudent ? _swbTool : _wbTool;
    ctx.globalCompositeOperation = tool==='eraser' ? 'destination-out' : 'source-over';
    ctx.strokeStyle = tool==='eraser' ? 'rgba(0,0,0,1)' : (isStudent ? document.getElementById('swbColor')?.value||'#EF4444' : document.getElementById('wbColor')?.value||'#3B82F6');
    ctx.lineWidth   = tool==='eraser' ? 20 : parseInt(document.getElementById(isStudent?'':'wbSize')?.value||4);
    ctx.beginPath(); ctx.moveTo(lastX,lastY); ctx.lineTo(x,y); ctx.stroke();
    [lastX,lastY] = [x,y];
  };
  const stop = () => { drawing = false; };
  canvas.addEventListener('mousedown', start); canvas.addEventListener('mousemove', draw);
  canvas.addEventListener('mouseup', stop);    canvas.addEventListener('mouseleave', stop);
  canvas.addEventListener('touchstart', start,{passive:false}); canvas.addEventListener('touchmove', draw,{passive:false});
  canvas.addEventListener('touchend', stop);
}

function setWbTool(t) { _wbTool=t; document.getElementById('wbPen').classList.toggle('active',t==='pen'); document.getElementById('wbEraser').classList.toggle('active',t==='eraser'); }
function setSwbTool(t){ _swbTool=t; document.getElementById('swbPen').classList.toggle('active',t==='pen'); document.getElementById('swbEraser').classList.toggle('active',t==='eraser'); }
function clearWhiteboard(){ if(_wbCtx){ _wbCtx.clearRect(0,0,_wbCtx.canvas.width,_wbCtx.canvas.height); } }

      if (d.class) {
        if (d.class.subject && subEl && !subEl.value)   subEl.value   = d.class.subject;
        if (d.class.grade  && gradeEl && !gradeEl.value) gradeEl.value = d.class.grade;
        if (d.class.curriculum && sel) {
          const mapped = CUR_MAP[d.class.curriculum];
          if (mapped) sel.value = mapped;
        }
      }
    } catch(_) {}
  }

  // Fallback: use school-level curriculum
  if (sel && sel.value === 'igcse') {
    const cur = SCHOOL?.curriculum || '';
    if (CUR_MAP[cur]) sel.value = CUR_MAP[cur];
  }
}

// Minimal, safe Markdown → HTML renderer (escapes first, then formats)
function mdToHtml(md) {
  let h = md.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  const lines = h.split(/\r?\n/);
  let out = '', inUl = false, inOl = false;
  const closeLists = () => { if (inUl){out+='</ul>';inUl=false;} if (inOl){out+='</ol>';inOl=false;} };
  const inline = s => s
    .replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>')
    .replace(/\*(.+?)\*/g,'<em>$1</em>')
    .replace(/`([^`]+)`/g,'<code style="background:#0F172A;padding:2px 6px;border-radius:4px;font-family:monospace;font-size:13px">$1</code>');
  for (let line of lines) {
    const t = line.trim();
    if (!t) { closeLists(); continue; }
    let m;
    if ((m = t.match(/^######\s+(.*)/))) { closeLists(); out += `<h6 style="margin:10px 0 4px;font-size:13px">${inline(m[1])}</h6>`; }
    else if ((m = t.match(/^#####\s+(.*)/))) { closeLists(); out += `<h5 style="margin:10px 0 4px;font-size:14px">${inline(m[1])}</h5>`; }
    else if ((m = t.match(/^####\s+(.*)/))) { closeLists(); out += `<h4 style="margin:12px 0 6px;font-size:15px;color:#F1F5F9">${inline(m[1])}</h4>`; }
    else if ((m = t.match(/^###\s+(.*)/))) { closeLists(); out += `<h3 style="margin:14px 0 6px;font-size:16px;color:#F1F5F9">${inline(m[1])}</h3>`; }
    else if ((m = t.match(/^##\s+(.*)/)))  { closeLists(); out += `<h2 style="margin:18px 0 8px;font-size:18px;color:#60A5FA;border-bottom:1px solid #334155;padding-bottom:4px">${inline(m[1])}</h2>`; }
    else if ((m = t.match(/^#\s+(.*)/)))   { closeLists(); out += `<h1 style="margin:8px 0 12px;font-size:22px;color:#F1F5F9">${inline(m[1])}</h1>`; }
    else if ((m = t.match(/^[-*]\s+(.*)/))) { if (!inUl){closeLists();out+='<ul style="margin:6px 0 6px 22px">';inUl=true;} out += `<li style="margin:3px 0">${inline(m[1])}</li>`; }
    else if ((m = t.match(/^\d+\.\s+(.*)/))) { if (!inOl){closeLists();out+='<ol style="margin:6px 0 6px 22px">';inOl=true;} out += `<li style="margin:3px 0">${inline(m[1])}</li>`; }
    else { closeLists(); out += `<p style="margin:6px 0">${inline(t)}</p>`; }
  }
  closeLists();
  return out;
}

async function generateNotes() {
  const subject    = document.getElementById('nt_subject').value.trim();
  const topic      = document.getElementById('nt_topic').value.trim();
  const grade      = document.getElementById('nt_grade').value.trim();
  const curriculum = document.getElementById('nt_curriculum').value;
  const focus      = document.getElementById('nt_focus').value.trim();
  const status     = document.getElementById('nt_status');
  const btn        = document.getElementById('nt_btn');
  if (!subject || !topic) { status.style.color='#EF4444'; status.textContent='Subject and topic are required.'; return; }

  btn.disabled = true;
  status.style.color = '#94A3B8';
  status.innerHTML = '⏳ Generating professional notes... this can take 10–30 seconds.';
  try {
    const d = await api('POST', '/teacher/generate-notes', { subject, topic, grade, curriculum, focus });
    _notesRaw = d.content || '';
    _notesMeta = { subject, topic, grade };
    document.getElementById('nt_output').innerHTML = mdToHtml(_notesRaw);
    document.getElementById('nt_output_wrap').style.display = 'block';
    document.getElementById('nt_share_msg').textContent = '';
    status.style.color = '#10B981';
    status.textContent = '✅ Notes ready!';
    document.getElementById('nt_output_wrap').scrollIntoView({ behavior: 'smooth', block: 'start' });
  } catch(e) {
    status.style.color = '#EF4444';
    status.textContent = e.message || 'Failed to generate notes.';
  } finally {
    btn.disabled = false;
  }
}

function copyNotes(btn) {
  navigator.clipboard.writeText(_notesRaw).then(() => {
    const orig = btn.textContent; btn.textContent = '✅ Copied!';
    setTimeout(() => { btn.textContent = orig; }, 1500);
  }).catch(() => alert('Copy failed'));
}

function downloadNotes() {
  const fname = `${(_notesMeta.subject||'notes')}_${(_notesMeta.topic||'')}`.replace(/[^a-z0-9]+/gi,'_').replace(/^_|_$/g,'') + '.md';
  const blob = new Blob([_notesRaw], { type: 'text/markdown;charset=utf-8;' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = fname; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 60000);
}

  const w = window.open('', '_blank');

const MATERIAL_API = 'https://ostazai-server-production.up.railway.app/api/school-materials';

async function secureDownload(url, filename) {
  try {
    const r = await fetch(url, { headers: { Authorization: 'Bearer ' + TOKEN } });
    if (!r.ok) { alert('Download failed — please try again.'); return; }
    const blob = await r.blob();
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = filename || 'download';
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 60000);
  } catch(e) { alert('Download error: ' + e.message); }
}

async function loadMaterials(wrapperId, canDelete) {
  const el = document.getElementById(wrapperId);
  if (!el) return;
  const mats = await api('GET', '/api/school-materials/');
  if (!mats.length) { el.innerHTML='<div style="color:#64748B;font-size:13px">No materials yet.</div>'; return; }
  el.innerHTML = mats.map(m => {
    const icon = m.type==='file'?'📎':m.type==='link'?'🔗':'📝';
    const action = m.type==='file'
      ? `<button class="btn btn-outline btn-sm" onclick="secureDownload('${MATERIAL_API}/${m._id}/download','${(m.fileName||'file').replace(/'/g,"\\'")}')">⬇️ Download</button>`
      : m.type==='link'
        ? `<a class="btn btn-outline btn-sm" href="${m.url}" target="_blank">🔗 Open</a>`
        : `<button class="btn btn-outline btn-sm" onclick="showTextContent('${m._id}','${m.title}')">👁️ View</button>`;
    return `<div class="material-card">
      <div class="m-icon">${icon}</div>
      <div class="m-info" style="flex:1">
        <div class="m-title">${m.title}</div>
        <div class="m-meta">${m.description||''} · ${new Date(m.uploadedAt).toLocaleDateString()}</div>
      </div>
      <div class="m-actions">
        ${action}
        ${canDelete?`<button class="btn btn-danger btn-sm" onclick="deleteMaterial('${m._id}','${wrapperId}',${canDelete})">✕</button>`:''}
      </div>
    </div>`;
  }).join('');
}

async function deleteMaterial(id, wrapperId, canDelete) {

  await api('DELETE',`/api/school-materials/${id}`);

function timeAgo(dateStr) {
  const s = Math.floor((Date.now() - new Date(dateStr)) / 1000);
  if (s < 60)   return 'Just now';
  if (s < 3600) return `${Math.floor(s/60)}m ago`;
  if (s < 86400)return `${Math.floor(s/3600)}h ago`;
  return new Date(dateStr).toLocaleDateString();
}

// apiReq removed — use api() for all requests (handles both /api/school/* and /api/school-*/ paths)
</script>
